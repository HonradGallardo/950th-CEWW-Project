{% extends "core/base.html" %}

{% block extra_js %}
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 transition-colors duration-300">
    <div class="w-full max-w-4xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row overflow-hidden">
        
        <div class="hidden md:flex md:w-1/2 bg-slate-50 dark:bg-slate-800/50 items-center justify-center p-12 border-r border-slate-100 dark:border-slate-800">
            <div class="text-center">
                <div class="w-24 h-24 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-200">
                    <i class="fas fa-shield-alt text-white text-4xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-tighter">950th CEWW</h2>
                <p class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase mt-2 tracking-widest">Personnel Recovery System</p>
            </div>
        </div>

        <div class="flex-1 p-8 lg:p-12">
            <div id="step-1" class="space-y-6">
                <div class="mb-8">
                    <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 uppercase">Forgot Password</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Step 1: System Identity Check</p>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Registered Email</label>
                    <input type="email" id="recovery-email" placeholder="Enter personnel email" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                </div>

                <div class="flex justify-center p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                    <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}" data-theme="dark"></div>
                </div>

                <div class="flex gap-3">
                    <button onclick="validateAndSendOTP()" id="send-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl text-[10px] uppercase tracking-widest transition-all shadow-lg shadow-blue-200 dark:shadow-none">Send OTP</button>
                    <a href="{% url 'login' %}" class="px-6 py-3 border border-slate-200 dark:border-slate-700 text-slate-400 font-black rounded-xl text-[10px] uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-800 transition-all">Cancel</a>
                </div>
            </div>

            <form id="step-2" onsubmit="handleReset(event)" class="hidden space-y-5">
                {% csrf_token %}
                <div class="flex justify-between items-center mb-4">
                    <span class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">Verification Required</span>
                    <span id="timer" class="text-[10px] font-black text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">300s remaining</span>
                </div>
                
                <input type="text" name="otp" placeholder="6-Digit OTP" required 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-center font-mono text-lg tracking-[0.5em] outline-none">
                
                <input type="password" name="new_password" placeholder="New Password" required 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none">
                
                <input type="password" name="confirm_password" placeholder="Confirm Password" required 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none">

                <div class="flex items-center justify-center gap-3 py-3 border-y border-slate-100 dark:border-slate-800">
                    <span id="num3" class="font-black text-blue-600"></span>
                    <span class="text-slate-400">+</span>
                    <span id="num4" class="font-black text-blue-600"></span>
                    <span class="text-slate-400">=</span>
                    <input type="number" name="step2_captcha_ans" required class="w-16 py-1 text-center border-b-2 border-blue-500 bg-transparent font-bold outline-none">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl text-[10px] uppercase tracking-widest transition-all">Confirm Reset</button>
            </form>
        </div>
    </div>
</div>

<script>
async function validateAndSendOTP() {
    const email = document.getElementById('recovery-email').value;
    const recaptchaResponse = grecaptcha.getResponse(); // Get the Google Token
    const btn = document.getElementById('send-btn');

    if(!email) { alert("Personnel email is required."); return; }
    if(!recaptchaResponse) { alert("Please complete the reCAPTCHA security check."); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Authenticating...';

    const formData = new FormData();
    formData.append('action', 'send_otp');
    formData.append('email', email);
    formData.append('g-recaptcha-response', recaptchaResponse); // Key for server-side verification
    formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

    try {
        const response = await fetch("{% url 'forgot_password' %}", { method: 'POST', body: formData });
        const data = await response.json();

        if (data.status === 'success') {
            document.getElementById('num3').innerText = data.num3;
            document.getElementById('num4').innerText = data.num4;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            startTimer(300); // Increased to 5 minutes to prevent premature expiration
        } else {
            alert(data.message);
            btn.disabled = false;
            btn.innerText = "Send OTP";
            grecaptcha.reset(); // Reset recaptcha on error
        }
    } catch (e) { 
        alert("Communication Error"); 
        btn.disabled = false; 
        btn.innerText = "Send OTP";
    }
}

function startTimer(duration) {
    let timer = duration;
    const display = document.getElementById('timer');
    const interval = setInterval(() => {
        if (timer > 0) {
            timer--;
            display.innerText = timer + "s remaining";
        } else {
            display.innerText = "OTP Expired";
            display.classList.add('text-red-500');
            clearInterval(interval);
        }
    }, 1000);
}

async function handleReset(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    formData.append('action', 'reset_password');

    const response = await fetch("{% url 'forgot_password' %}", { method: 'POST', body: formData });
    const data = await response.json();

    if(data.status === 'success') {
        alert("Personnel Credentials Updated.");
        window.location.href = "{% url 'login' %}";
    } else {
        alert(data.message);
    }
}
</script>
{% endblock %}
