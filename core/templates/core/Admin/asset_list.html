{% extends 'base.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="flex flex-col lg:flex-row gap-6 lg:h-full lg:overflow-hidden p-1 sm:p-0 transition-colors duration-300 dark:bg-slate-900">
    
    <div class="flex-1 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col min-h-[500px] lg:min-h-0">
        
        <div class="p-4 sm:p-6 border-b border-slate-100 dark:border-slate-700 flex-none flex justify-between items-center">
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-0 tracking-tight uppercase">IT Asset Inventory</h2>
            <div class="flex items-center gap-3">
                {% if not request.user.groups.all.0.name == "Commander" %}
                <a href="{% url 'add_asset' %}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-500/20 flex items-center gap-2">
                    <i class="fas fa-plus"></i> <span class="hidden sm:inline">Add Asset</span>
                </a>
                {% endif %}
                
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-yellow-400 border border-slate-200 dark:border-slate-600 transition-all">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="p-4 sm:px-6 py-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex flex-col sm:flex-row w-full gap-2">
                    <div class="relative w-full sm:w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" placeholder="Search assets..." 
                            class="w-full pl-9 pr-3 py-2.5 sm:py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/10 text-slate-700 dark:text-slate-200 shadow-sm">
                    </div>
                    <select id="typeFilter" 
                        class="w-full sm:w-auto px-3 py-2.5 sm:py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm outline-none cursor-pointer font-bold text-slate-600 dark:text-slate-300 hover:border-slate-300 shadow-sm">
                        <option value="all">All Types</option>
                        <option value="PC">PC</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Server">Server</option>
                        <option value="Router">Router</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto custom-scrollbar p-4 sm:p-6 bg-slate-50 dark:bg-[#0f172a]" id="assetCardContainer">
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6" id="tableBody"></div>
        </div>

        <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest" id="pageInfo">Showing 0-0 of 0 assets</p>
            <div class="flex items-center space-x-2" id="paginationControls"></div>
        </div>
    </div>

    <div class="w-full lg:w-80 flex-none pb-10 lg:pb-0">
        
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 h-full">
            <h3 class="font-black text-[10px] mb-6 text-slate-800 dark:text-slate-100 uppercase tracking-widest">Status Distribution</h3>
            <div class="relative h-64 w-full"><canvas id="statusChart"></canvas></div>
            <div class="mt-8 text-[10px] font-black text-slate-500 pt-6 flex justify-between items-center uppercase border-t border-slate-100 dark:border-slate-700">
                <p>Total Assets Registered</p>
                <span id="total-asset-badge" class="text-slate-900 dark:text-slate-100 text-xl font-black">0</span>
            </div>
        </div>
    </div>
</div>

<script>
/** * GLOBAL STATE */
let allAssets = [];
let currentPage = 1;
const rowsPerPage = 6; // Changed from 12 to 6
let myChart;

/**
 * 1. API CONNECTIVITY
 */
function loadAssets() {
    const typeFilter = $('#typeFilter').val();
    let apiUrl = '/api/assets/';
    if (typeFilter !== 'all') apiUrl += `?assets_type=${typeFilter}`;

    $.ajax({
        url: apiUrl,
        type: 'GET',
        success: function(data) {
            allAssets = data;
            currentPage = 1; 
            updateTableUI();
            updateDashboardMetrics(data);
        },
        error: function(err) { console.error("API Sync Failed:", err); }
    });
}

/**
 * 2. EXPANDED CARD RENDERING ENGINE
 */
function updateTableUI() {
    const searchVal = $('#searchInput').val().toLowerCase();
    
    const filtered = allAssets.filter(a => 
        a.assets_name.toLowerCase().includes(searchVal) || 
        (a.assets_id && a.assets_id.toString().toLowerCase().includes(searchVal)) ||
        a.location.toLowerCase().includes(searchVal)
    );

    const totalEntries = filtered.length;
    const totalPages = Math.ceil(totalEntries / rowsPerPage) || 1;
    
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const paginatedItems = filtered.slice(start, end);

    renderCards(paginatedItems); 
    renderPaginationControls(totalPages);
    
    const displayEnd = Math.min(end, totalEntries);
    $('#pageInfo').text(`Showing ${totalEntries === 0 ? 0 : start + 1}-${displayEnd} of ${totalEntries} assets`);
}

function renderCards(items) {
    const $container = $('#tableBody');
    let html = '';

    if (items.length === 0) {
        $container.html('<div class="col-span-full p-12 text-center text-slate-400 italic bg-white dark:bg-slate-800 rounded-xl border border-dashed border-slate-300 dark:border-slate-700">No assets found matching your criteria.</div>');
        return;
    }

    items.forEach(asset => {
        const statusClasses = getStatusClasses(asset.status);
        const iconClass = getIconClass(asset.assets_type);
        const isCommander = "{{ request.user.groups.all.0.name }}" === "Commander";
        const assetId = asset.assets_id || asset.id;
        
        // Use the helper to get the specific color for the hover state
        const hoverColorClass = getStatusHoverColor(asset.status);

        // Expanded Card HTML with Hover Glow AND bottom accent line
        html += `
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm transition-all duration-300 relative overflow-hidden group hover:-translate-y-1 hover:shadow-lg ${hoverColorClass}">
            
            <div class="flex justify-between items-start mb-5 border-b border-slate-100 dark:border-slate-700/50 pb-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800 flex items-center justify-center text-slate-500 dark:text-slate-400 transition-colors">
                        <i class="fas ${iconClass} text-2xl"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-slate-800 dark:text-slate-100 text-lg leading-tight tracking-tight">${asset.assets_name}</h3>
                        <span class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest block mt-1">${asset.assets_type}</span>
                    </div>
                </div>
                
                <div class="flex flex-col items-end gap-2 z-10 relative">
                    <span class="px-3 py-1 rounded-md text-[10px] font-black uppercase ${statusClasses}">
                        ${asset.status}
                    </span>
                    ${!isCommander ? `
                    <a href="/assets/edit/${asset.id}/" class="text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors p-1" title="Edit Asset">
                        <i class="fas fa-edit"></i>
                    </a>
                    ` : ''}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-y-4 gap-x-6 mb-2 relative z-10">
                <div>
                    <label class="text-[9px] uppercase font-black text-slate-400 tracking-widest block mb-1">Asset ID</label>
                    <p class="font-mono text-sm font-bold text-slate-700 dark:text-slate-300">#${assetId}</p>
                </div>
                <div>
                    <label class="text-[9px] uppercase font-black text-slate-400 tracking-widest block mb-1">Location</label>
                    <p class="text-sm font-medium text-slate-600 dark:text-slate-400 truncate flex items-center gap-1.5">
                        <i class="fas fa-map-marker-alt text-slate-300 dark:text-slate-600 text-xs"></i> 
                        ${asset.location}
                    </p>
                </div>
                <div class="col-span-2">
                    <label class="text-[9px] uppercase font-black text-slate-400 tracking-widest block mb-1">Date Added</label>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400">${asset.date_added || 'N/A'}</p>
                </div>
            </div>
            
            <div class="absolute bottom-0 left-0 w-full h-1 ${getStatusAccentColor(asset.status)} opacity-50 group-hover:opacity-100 transition-opacity"></div>
        </div>`;
    });
    
    $container.html(html);
}

function renderPaginationControls(totalPages) {
    const $container = $('#paginationControls');
    $container.empty();
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        const isActive = (i === currentPage);
        const btnClass = isActive 
            ? `w-8 h-8 flex items-center justify-center rounded-lg text-[10px] font-black transition-all bg-blue-600 text-white border border-blue-600 shadow-sm`
            : `w-8 h-8 flex items-center justify-center rounded-lg text-[10px] font-black transition-all bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-600`;
        
        const $btn = $(`<button class="${btnClass}">${i}</button>`);
        $btn.on('click', function() {
            currentPage = i;
            updateTableUI();
        });
        $container.append($btn);
    }
}

/**
 * 3. DASHBOARD METRICS (Chart & Total)
 */
function updateDashboardMetrics(assets) {
    const active = assets.filter(a => a.status === 'Active').length;
    const maintenance = assets.filter(a => a.status === 'Maintenance').length;
    const inactive = assets.filter(a => a.status === 'Inactive' || a.status === 'Offline').length;

    $('#total-asset-badge').text(assets.length);

    if (myChart) {
        myChart.data.datasets[0].data = [active, inactive, maintenance];
        myChart.update();
    }
}

/**
 * HELPERS & THEME
 */
function getStatusClasses(status) {
    if (status === 'Active') return 'bg-emerald-50 border border-emerald-200 text-emerald-700 dark:bg-emerald-500/10 dark:border-emerald-500/20 dark:text-emerald-400';
    if (status === 'Maintenance') return 'bg-amber-50 border border-amber-200 text-amber-700 dark:bg-amber-500/10 dark:border-amber-500/20 dark:text-amber-400';
    return 'bg-red-50 border border-red-200 text-red-700 dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-400';
}

// Helper to apply a glowing ring and border based on status
function getStatusHoverColor(status) {
    if (status === 'Active') return 'hover:border-emerald-400 hover:ring-4 hover:ring-emerald-500/20 dark:hover:border-emerald-500 dark:hover:ring-emerald-500/30';
    if (status === 'Maintenance') return 'hover:border-amber-400 hover:ring-4 hover:ring-amber-500/20 dark:hover:border-amber-500 dark:hover:ring-amber-500/30';
    return 'hover:border-red-400 hover:ring-4 hover:ring-red-500/20 dark:hover:border-red-500 dark:hover:ring-red-500/30';
}

function getStatusAccentColor(status) {
    if (status === 'Active') return 'bg-emerald-500';
    if (status === 'Maintenance') return 'bg-amber-500';
    return 'bg-red-500';
}

function getIconClass(type) {
    const map = { 'PC': 'fa-desktop', 'Laptop': 'fa-laptop', 'Server': 'fa-server', 'Router': 'fa-network-wired' };
    return map[type] || 'fa-microchip';
}

function toggleDarkMode() {
    const isDark = document.documentElement.classList.toggle('dark');
    document.body.classList.toggle('dark-mode'); 
    $('#theme-icon').toggleClass('fa-moon fa-sun');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateChartTheme();
}

function updateChartTheme() {
    if (!myChart) return;
    const isDark = document.documentElement.classList.contains('dark');
    const color = isDark ? '#94a3b8' : '#64748b';
    myChart.options.plugins.legend.labels.color = color;
    myChart.options.elements.arc.borderColor = isDark ? '#1e293b' : '#ffffff';
    myChart.update();
}

/**
 * INITIALIZATION
 */
$(document).ready(function() {
    // Theme Check
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark-mode');
        $('#theme-icon').removeClass('fa-moon').addClass('fa-sun');
    }

    // Init Chart
    const ctx = document.getElementById('statusChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Active', 'Inactive', 'Maintenance'],
            datasets: [{
                data: [0, 0, 0],
                backgroundColor: ['#10b981', '#64748b', '#f59e0b'],
                borderWidth: 4,
                borderColor: document.documentElement.classList.contains('dark') ? '#1e293b' : '#ffffff',
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '75%',
            plugins: {
                legend: { 
                    position: 'bottom', 
                    labels: { 
                        boxWidth: 8, 
                        padding: 15, 
                        font: { size: 9, weight: '900', family: 'Inter' },
                        color: document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b'
                    } 
                }
            }
        }
    });

    // Initial Data Load
    loadAssets();

    // Event Listeners
    $('#searchInput').on('input', function() {
        currentPage = 1;
        updateTableUI();
    });
    $('#typeFilter').on('change', loadAssets);

    // Sync situational awareness every 2 minutes
    setInterval(loadAssets, 120000);
});
</script>

<style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
</style>
{% endblock %}
