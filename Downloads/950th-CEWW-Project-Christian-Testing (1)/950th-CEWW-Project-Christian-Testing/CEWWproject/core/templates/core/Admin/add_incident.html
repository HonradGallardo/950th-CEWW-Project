{% extends "core/Admin/admin_dashboard.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-screen p-2 sm:p-4 md:p-6 bg-slate-50/50 dark-mode:bg-[#0f172a] transition-colors duration-300 content-bg">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden transition-all registration-card">
        
        <div class="bg-slate-50 px-4 sm:px-8 py-5 border-b border-slate-200 card-header-bg">
            <h2 class="text-base sm:text-lg font-black text-slate-800 dark-mode-text uppercase tracking-tight text-center">Add New Incident Report</h2>
        </div>

        <form method="POST" class="p-4 sm:p-8 space-y-4 sm:space-y-6" id="incidentForm">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Technician</p>
                    <p class="text-xs sm:text-sm font-bold text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100 flex flex-wrap items-center info-badge">
                        {{ request.user.username }} 
                        <span class="text-[9px] sm:text-[10px] text-slate-400 font-normal ml-0 sm:ml-2 w-full sm:w-auto mt-1 sm:mt-0">(Automatically Appended)</span>
                    </p>
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Date / Time</p>
                    <p class="text-xs sm:text-sm font-bold text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100 flex flex-wrap items-center info-badge">
                        {% now "d-m-Y H:i" %} 
                        <span class="text-[9px] sm:text-[10px] text-slate-400 font-normal ml-0 sm:ml-2 w-full sm:w-auto mt-1 sm:mt-0">(Current Server Time)</span>
                    </p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-4 items-start md:items-center gap-1 md:gap-2">
                    <label class="text-[10px] sm:text-xs font-black text-slate-500 uppercase">Threat:</label>
                    <div class="md:col-span-3">
                        <input type="text" name="title" required placeholder="e.g. Unauthorized Access Attempt"
                            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition custom-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-start md:items-center gap-1 md:gap-2">
                    <label class="text-[10px] sm:text-xs font-black text-slate-500 uppercase">Severity:</label>
                    <div class="md:col-span-3">
                        <select name="severity" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none cursor-pointer appearance-none focus:ring-2 focus:ring-blue-500 custom-input">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-start md:items-center gap-1 md:gap-2">
                    <label class="text-[10px] sm:text-xs font-black text-slate-500 uppercase">Affected Area:</label>
                    <div class="md:col-span-3">
                        <input type="text" name="affected_area" placeholder="e.g. Server Room / HR Department"
                            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 custom-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-start md:items-center gap-1 md:gap-2">
                    <label class="text-[10px] sm:text-xs font-black text-slate-500 uppercase">Status:</label>
                    <div class="md:col-span-3">
                        <select name="status" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none cursor-pointer appearance-none focus:ring-2 focus:ring-blue-500 custom-input">
                            <option value="Open">Open</option>
                            <option value="Investigating">Investigating</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2 pt-2">
                    <label class="text-[10px] sm:text-xs font-black text-slate-500 uppercase">Detailed Description:</label>
                    <textarea name="description" rows="5" placeholder="Provide full details of the incident and initial findings..."
                        class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none transition resize-none min-h-[120px] custom-input"></textarea>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black uppercase text-[10px] sm:text-xs tracking-widest py-4 rounded-xl transition-all active:scale-[0.98] adaptive-button">
                    Submit Incident Report
                </button>
                <div class="mt-6 text-center">
                    <a href="{% url 'incident_list' %}" class="text-[10px] font-bold text-slate-400 uppercase hover:text-slate-600 transition inline-block py-2">
                        Cancel and return to feed
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    /* --- ADAPTIVE BUTTON SHADOW --- */
    .adaptive-button {
        /* Light Mode Shadow (Glowy Blue) */
        box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3), 0 4px 6px -2px rgba(37, 99, 235, 0.1);
    }

    body.dark-mode .adaptive-button {
        /* Dark Mode Shadow (Deep Black/Subtle) */
        box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.6) !important;
    }

    /* --- DARK MODE OVERRIDES --- */
    body.dark-mode .content-bg { 
        background-color: #0f172a !important; 
    }

    body.dark-mode .registration-card { 
        background-color: #111827 !important; 
        border-color: #1f2937 !important; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
    }

    body.dark-mode .card-header-bg { 
        background-color: #1f2937 !important; 
        border-bottom-color: #374151 !important; 
    }

    body.dark-mode .dark-mode-text { 
        color: #f9fafb !important; 
    }

    body.dark-mode .info-badge {
        background-color: #1f2937 !important;
        border-color: #374151 !important;
        color: #e5e7eb !important;
    }

    body.dark-mode .custom-input {
        background-color: #1f2937 !important;
        border-color: #374151 !important;
        color: #f1f5f9 !important;
    }

    body.dark-mode .custom-input::placeholder {
        color: #6b7280 !important;
    }

    body.dark-mode .info-badge {
        color: #f3f4f6 !important;
    }
</style>
{% endblock %}
