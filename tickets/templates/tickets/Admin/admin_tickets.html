{% extends "base.html" %}

{% block content %}
<style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    :root {
        --head-bg: rgba(248, 250, 252, 0.8);
        --head-text: #0F172A;
        --head-border: #e2e8f0;
        --row-hover: #f1f5f9;
        --nav-height: 73px; 
    }

    .dark {
        --head-bg: #0F172A;
        --head-text: #F8FAFC;
        --head-border: #1e293b;
        --row-hover: #1e293b;
    }

    #head {
        background-color: var(--head-bg) !important;
        backdrop-filter: blur(8px);
        color: var(--head-text) !important;
        border-color: var(--head-border) !important;
        transition: all 0.3s ease;
        top: 0; 
        position: sticky;
        z-index: 30;
    }

    .admin-table-container {
        height: auto; 
        overflow: visible;
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }

    .ticket-row { transition: all 0.2s ease; cursor: pointer; }
    .ticket-row:hover { background-color: var(--row-hover) !important; }

    .id-badge {
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: -0.05em;
    }

    .action-menu {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        z-index: 50;
        min-width: 160px;
        animation: menuFade 0.2s ease-out;
    }

    @keyframes menuFade {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .action-btn-trigger {
        transition: all 0.2s ease;
    }
    .action-btn-trigger:hover {
        background-color: rgba(59, 130, 246, 0.1);
    }

    @media (max-width: 1024px) {
        .admin-table-container { height: auto; overflow: visible; }
        table, thead, tbody, th, td, tr { display: block; }
        thead tr { position: absolute; top: -9999px; left: -9999px; }
        
        #ticketTableBody {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0.75rem;
            padding: 0.5rem;
        }

        .ticket-row {
            background: white !important;
            border: 1px solid var(--head-border) !important;
            border-radius: 0.75rem;
            padding: 0.75rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .dark .ticket-row { background: #1e293b !important; }
        
        .ticket-row td { 
            padding: 0 !important; 
            border: none !important;
            width: 100% !important;
            max-width: none !important;
        }
    }
</style>

<div class="min-h-[calc(100vh-73px)] dark:bg-[#0F172A] p-2 md:p-4 text-slate-900 dark:text-slate-300 font-sans transition-colors duration-300">
    
    <header id="head" class="flex flex-col gap-4 p-4 mb-4 rounded-2xl border shadow-lg backdrop-blur-md">
        <div class="flex items-center justify-between">
            <div class="flex flex-col">
                <h1 class="text-sm md:text-lg font-black tracking-tight uppercase flex items-center gap-2">
                    <i class="fas fa-shield-alt text-blue-600 animate-pulse"></i>
                    Support Command Center
                </h1>
                <p class="text-[7px] md:text-[9px] uppercase tracking-[0.3em] font-bold opacity-60 text-blue-500">
                    Administrative Dispatch Overview
                </p>
            </div>
            <div class="lg:hidden bg-blue-600/10 border border-blue-500/20 px-2 py-1 rounded-lg">
                <span id="mobileCount" class="text-[10px] font-black text-blue-600">00</span>
            </div>
        </div>
        
        <div class="flex flex-col md:flex-row items-stretch md:items-center gap-3">
            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-search text-slate-400 text-xs"></i>
                </span>
                <input type="text" id="ticketSearch" placeholder="Search ID, Name, or Date..." 
                    class="w-full bg-slate-100/50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/10 rounded-xl py-2 pl-9 pr-3 text-xs font-semibold outline-none transition-all">
            </div>
            
            <div class="flex overflow-x-auto no-scrollbar bg-slate-100/80 dark:bg-slate-800/80 p-1 rounded-xl border border-slate-200/50 dark:border-slate-700/30 gap-1">
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 bg-white dark:bg-blue-600 shadow-sm text-blue-600 dark:text-white text-[9px] font-black uppercase tracking-widest rounded-lg transition-all" data-filter="all" onclick="filterTable('all', this)">All</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 text-slate-500 text-[9px] font-black uppercase tracking-widest rounded-lg hover:bg-white/50 dark:hover:bg-slate-700 transition-all" data-filter="pending" onclick="filterTable('Pending', this)">Pending</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 text-slate-500 text-[9px] font-black uppercase tracking-widest rounded-lg hover:bg-white/50 dark:hover:bg-slate-700 transition-all" data-filter="mine" onclick="filterTable('mine', this)">Assigned</button>
                <button class="filter-btn whitespace-nowrap px-4 py-1.5 text-slate-500 text-[9px] font-black uppercase tracking-widest rounded-lg hover:bg-white/50 dark:hover:bg-slate-700 transition-all" data-filter="completed" onclick="filterTable('completed', this)">Resolved</button>
            </div>
        </div>
    </header>

    <div class="bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-xl md:rounded-2xl shadow-2xl overflow-visible flex flex-col backdrop-blur-sm">
        <div class="admin-table-container overflow-auto custom-scrollbar">
            <table class="w-full text-left border-separate border-spacing-0 lg:min-w-[1000px]">
                <thead class="hidden lg:table-header-group">
                    <tr class="sticky top-0 z-10 bg-slate-50/90 dark:bg-slate-800/90 backdrop-blur-md">
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Ref ID</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Priority</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Client</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Issue & Snippet</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Agent Details</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700 text-center">Status</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700">Created At</th>
                        <th class="p-2.5 text-[9px] font-black uppercase tracking-widest text-slate-400 border-b dark:border-slate-700 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/50"></tbody>
            </table>
        </div>
        <div class="p-4 border-t border-slate-100 dark:border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
            <span id="pageIndicator" class="text-[9px] font-black text-slate-400 uppercase tracking-widest"></span>
            <div class="flex items-center gap-2">
                <button id="prevPage" onclick="changePage(-1)" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 disabled:opacity-30"><i class="fas fa-chevron-left text-[10px]"></i></button>
                <div id="pageNumbers" class="flex gap-1"></div>
                <button id="nextPage" onclick="changePage(1)" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 disabled:opacity-30"><i class="fas fa-chevron-right text-[10px]"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    let allTickets = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    const currentAdminUser = "{{ request.user.username }}";
    const currentUserId = "{{ request.user.id }}";

    // Reusable function to force the scroll to the top of the content
    function scrollToTop() {
        const headElement = document.getElementById('head');
        if (headElement) {
            headElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    async function initAdminSync() {
        try {
            const response = await fetch('/tickets/api/support-api/', { 
                headers: { 'X-Requested-With': 'XMLHttpRequest' } 
            });
            if (!response.ok) return;
            const data = await response.json();
            allTickets = Array.isArray(data) ? data : (data.results || []); 
            updateUI();
        } catch (err) { console.error("Sync Error:", err); }
    }

    function getPriorityStyles(priority) {
        const base = "flex items-center gap-1.5 font-black text-[9px] uppercase tracking-tighter ";
        if (priority === 'High') return base + 'text-red-500';
        if (priority === 'Medium') return base + 'text-amber-500';
        return base + 'text-blue-400';
    }

    function formatTimestamp(dateStr) {
        if (!dateStr) return "N/A";
        const date = new Date(dateStr);
        return date.toLocaleString('en-US', { 
            month: 'short', day: 'numeric', year: 'numeric',
            hour: '2-digit', minute: '2-digit', hour12: true 
        });
    }

    function toggleActionMenu(event, specificMenuId) {
        event.stopPropagation();
        document.querySelectorAll('.action-menu').forEach(menu => {
            if (menu.id !== specificMenuId) menu.style.display = 'none';
        });
        const menu = document.getElementById(specificMenuId);
        if(menu) {
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.action-menu').forEach(menu => {
            menu.style.display = 'none';
        });
    });

    function updateUI() {
        const body = document.getElementById('ticketTableBody');
        const searchTerm = document.getElementById('ticketSearch').value.toLowerCase();
        const activeBtn = document.querySelector('.filter-btn.bg-white, .filter-btn.dark\\:bg-blue-600');
        const filterType = activeBtn ? activeBtn.getAttribute('data-filter') : 'all';

        let filtered = allTickets.filter(t => {
            const paddedId = String(t.id).padStart(6, '0');
            const searchableContent = [
                t.id.toString(), paddedId, (t.subject || ""), (t.description || ""), (t.status || ""), 
                (t.priority || ""), (t.user_name || ""), (t.first_name || ""), 
                (t.last_name || ""), (t.technician_name || ""), formatTimestamp(t.created_at).toLowerCase()
            ].join(" ").toLowerCase();

            const matchesSearch = searchableContent.includes(searchTerm);
            let matchesFilter = true;
            if (filterType === 'pending') matchesFilter = (t.status || "").toLowerCase() === 'pending';
            else if (filterType === 'mine') matchesFilter = t.technician_name === currentAdminUser;
            else if (filterType === 'completed') {
                const s = (t.status || "").toLowerCase();
                matchesFilter = (s === 'resolved' || s === 'closed' || s === 'completed');
            }
            return matchesSearch && matchesFilter;
        });

        const mobileCountEl = document.getElementById('mobileCount');
        if(mobileCountEl) mobileCountEl.innerText = String(filtered.length).padStart(2, '0');

        const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const start = (currentPage - 1) * itemsPerPage;
        const paginatedItems = filtered.slice(start, start + itemsPerPage);

        if (paginatedItems.length === 0) {
            body.innerHTML = `<tr><td colspan="8" class="p-20 text-center text-[10px] font-black uppercase tracking-widest opacity-40">No records found</td></tr>`;
        } else {
            body.innerHTML = paginatedItems.map(t => `
                <tr class="ticket-row group" onclick="goToDetail(${t.id})">
                    <td class="p-4 lg:w-32">
                        <div class="lg:block flex justify-between items-center w-full">
                            <span class="id-badge font-bold text-blue-600 text-[12px] bg-blue-50 dark:bg-blue-500/10 px-2 py-1 rounded border border-blue-100 dark:border-blue-500/20">
                                #${String(t.id).padStart(6, '0')}
                            </span>
                            <div class="lg:hidden text-right relative">
                                <button onclick="toggleActionMenu(event, 'menu-mobile-${t.id}')" class="action-btn-trigger h-8 w-8 rounded-full flex items-center justify-center text-slate-400 hover:text-blue-600">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <div id="menu-mobile-${t.id}" class="action-menu bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-xl overflow-hidden right-0">
                                     <button onclick="quickAction(event, ${t.id}, 'assign')" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-3">
                                        <i class="fas fa-user-plus text-blue-500"></i> Assign To Me
                                    </button>
                                    <button onclick="quickAction(event, ${t.id}, 'resolve')" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-3">
                                        <i class="fas fa-check-circle text-emerald-500"></i> Mark Resolved
                                    </button>
                                    <div class="border-t dark:border-slate-700"></div>
                                    <button onclick="deleteTicket(event, ${t.id})" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3">
                                        <i class="fas fa-trash-alt"></i> Delete Record
                                    </button>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="${getPriorityStyles(t.priority)}">
                            <i class="fas fa-circle text-[6px]"></i> ${t.priority || 'Low'}
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="flex flex-col">
                            <span class="font-bold text-xs">${t.first_name || ''} ${t.last_name || ''}</span>
                            <span class="text-[9px] opacity-50 font-medium">@${t.user_name}</span>
                        </div>
                    </td>
                    <td class="p-4 lg:max-w-[280px]">
                        <div class="flex flex-col overflow-hidden">
                            <p class="font-bold text-xs truncate group-hover:text-blue-500 transition-colors">${t.subject}</p>
                            <p class="text-[10px] opacity-50 truncate italic">"${t.description || 'No details provided'}"</p>
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold text-slate-500"><i class="fas fa-user-shield mr-1.5 opacity-50"></i>${t.technician_name || 'Unassigned'}</span>
                            <span class="text-[8px] opacity-40 uppercase font-black">Prev: ${t.previous_technician || 'None'}</span>
                        </div>
                    </td>
                    <td class="p-4 lg:text-center">
                        <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase border dark:bg-slate-800/50">${t.status}</span>
                    </td>
                    <td class="p-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-black text-slate-600 dark:text-slate-400 whitespace-nowrap">${formatTimestamp(t.created_at)}</span>
                            <span class="text-[8px] opacity-40 font-bold uppercase tracking-widest">Logged</span>
                        </div>
                    </td>
                    <td class="p-4 text-right relative hidden lg:table-cell">
                        <button onclick="toggleActionMenu(event, 'menu-desktop-${t.id}')" class="action-btn-trigger h-8 w-8 rounded-full flex items-center justify-center text-slate-400 hover:text-blue-600">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                        <div id="menu-desktop-${t.id}" class="action-menu bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-xl overflow-hidden">
                            <button onclick="quickAction(event, ${t.id}, 'assign')" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-3">
                                <i class="fas fa-user-plus text-blue-500"></i> Assign To Me
                            </button>
                            <button onclick="quickAction(event, ${t.id}, 'resolve')" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center gap-3">
                                <i class="fas fa-check-circle text-emerald-500"></i> Mark Resolved
                            </button>
                            <div class="border-t dark:border-slate-700"></div>
                            <button onclick="deleteTicket(event, ${t.id})" class="w-full px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3">
                                <i class="fas fa-trash-alt"></i> Delete Record
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        const showingStart = filtered.length > 0 ? start + 1 : 0;
        const showingEnd = Math.min(start + itemsPerPage, filtered.length);
        document.getElementById('pageIndicator').innerText = `NODE ${showingStart}-${showingEnd} / TOTAL ${filtered.length}`;
        
        document.getElementById('prevPage').disabled = (currentPage <= 1);
        document.getElementById('nextPage').disabled = (currentPage >= totalPages);

        const pageNumbersContainer = document.getElementById('pageNumbers');
        pageNumbersContainer.innerHTML = '';
        
        let startPage = Math.max(1, currentPage - 1);
        let endPage = Math.min(totalPages, startPage + 2);
        if (endPage - startPage < 2) startPage = Math.max(1, endPage - 2);

        for (let i = startPage; i <= endPage; i++) {
            const isCurrent = i === currentPage;
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = `px-3 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all border ${
                isCurrent ? 'bg-blue-600 text-white border-blue-600' : 'bg-white dark:bg-slate-800 text-slate-500 border-slate-200'
            }`;
            btn.onclick = () => { 
                currentPage = i; 
                updateUI(); 
                scrollToTop(); // Use the enhanced scroll function
            };
            pageNumbersContainer.appendChild(btn);
        }
    }

    function changePage(dir) { 
        currentPage += dir; 
        updateUI(); 
        scrollToTop(); // Use the enhanced scroll function
    }

    function goToDetail(id) { window.location.href = `/tickets/detail/${id}/`; }

    async function quickAction(event, id, type) {
        event.stopPropagation();
        const payload = type === 'assign' 
            ? { technician_id: currentUserId, status: 'In Progress', priority: 'Medium' } 
            : { status: 'Resolved' };
        
        try {
            const res = await fetch(`/tickets/api/support-api/${id}/update_technical_details/`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-CSRFToken': '{{ csrf_token }}',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(payload)
            });
            if (res.ok) initAdminSync();
        } catch (err) { console.error(err); }
    }

    async function deleteTicket(event, id) {
        event.stopPropagation();
        if (!confirm("Are you sure you want to permanently delete this dispatch record?")) return;
        try {
            const res = await fetch(`/tickets/api/support-api/${id}/`, {
                method: 'DELETE',
                headers: { 
                    'X-CSRFToken': '{{ csrf_token }}',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            if (res.ok) initAdminSync();
        } catch (err) { console.error(err); }
    }

    function filterTable(type, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('bg-white', 'dark:bg-blue-600', 'text-blue-600', 'dark:text-white', 'shadow-sm');
            b.classList.add('text-slate-500');
        });
        btn.classList.add('bg-white', 'dark:bg-blue-600', 'text-blue-600', 'dark:text-white', 'shadow-sm');
        btn.classList.remove('text-slate-500');
        currentPage = 1;
        updateUI();
    }

    document.getElementById('ticketSearch').addEventListener('input', () => { 
        currentPage = 1; 
        updateUI(); 
    });

    window.addEventListener('DOMContentLoaded', () => { 
        initAdminSync(); 
        setInterval(initAdminSync, 30000); 
    });
</script>
{% endblock %}
