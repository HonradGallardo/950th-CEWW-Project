{% extends "core/admin_dashboard.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-full p-4 bg-slate-50/50">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        
        <div class="bg-slate-50 px-8 py-5 border-b border-slate-200">
            <h2 class="text-lg font-black text-slate-800 uppercase tracking-tight text-center">Add New Incident Report</h2>
        </div>

        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Technician</p>
                    <p class="text-sm font-bold text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                        {{ request.user.username }} <span class="text-[10px] text-slate-400 font-normal ml-2">(Automatically Appended)</span>
                    </p>
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Date / Time</p>
                    <p class="text-sm font-bold text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                        {% now "d-m-Y H:i" %} <span class="text-[10px] text-slate-400 font-normal ml-2">(Current Server Time)</span>
                    </p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-2">
                    <label class="text-xs font-black text-slate-500 uppercase">Threat:</label>
                    <div class="md:col-span-3">
                        <input type="text" name="title" required placeholder="e.g. Unauthorized Access Attempt"
                            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-2">
                    <label class="text-xs font-black text-slate-500 uppercase">Severity:</label>
                    <div class="md:col-span-3">
                        <select name="severity" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-2">
                    <label class="text-xs font-black text-slate-500 uppercase">Affected Area:</label>
                    <div class="md:col-span-3">
                        <input type="text" name="affected_area" placeholder="e.g. Server Room / HR Department"
                            class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-center gap-2">
                    <label class="text-xs font-black text-slate-500 uppercase">Status:</label>
                    <div class="md:col-span-3">
                        <select name="status" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-bold outline-none">
                            <option value="Open">Open</option>
                            <option value="Investigating">Investigating</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2 pt-2">
                    <label class="text-xs font-black text-slate-500 uppercase">Detailed Description:</label>
                    <textarea name="description" rows="5" placeholder="Provide full details of the incident and initial findings..."
                        class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none transition resize-none"></textarea>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black uppercase text-xs tracking-widest py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98]">
                    Submit Incident Report
                </button>
                <div class="mt-4 text-center">
                    <a href="{% url 'incident_list' %}" class="text-[10px] font-bold text-slate-400 uppercase hover:text-slate-600 transition">
                        Cancel and return to feed
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
